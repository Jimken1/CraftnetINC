<!--
  Design summary:
  - Tailwind CLI stylesheet and design tokens applied to the auth shell
  - Lucide-ready icon layer + reduced-motion compatibility added
  - No auth, Supabase, or backend logic changed
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Login - Craftnet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="stylesheet" href="dark-mode.css">
    <link rel="stylesheet" href="mobile-responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden-view { display: none; }

        #toggle-password{
          position: absolute !important;
          top: 50% !important;
          right: 12px !important;
          left: auto !important;
          transform: translateY(-50%) !important;

          width: 40px !important;
          height: 40px !important;
          padding: 0 !important;
          margin: 0 !important;

          display: flex !important;
          align-items: center !important;
          justify-content: center !important;

          z-index: 10 !important;
        }

        #login-password{
          position: relative !important;
          z-index: 1 !important;
        }
    </style>
</head>
<body class="auth-page auth-login bg-cream text-ink">
    <div class="auth-shell w-full max-w-md">
        <div class="flex justify-center mb-6">
            <a href="index.html">
                    <img src="logo.svg" alt="Craftnet logo" class="auth-logo-mark h-16 w-16 object-contain">
            </a>
        </div>
        <h2 class="text-2xl sm:text-3xl font-bold text-center text-gray-900 mb-6">Sign in to your account</h2>
        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 font-semibold mb-2 text-base">Email Address</label>
                <input type="email" id="login-email" name="email" class="w-full px-4 py-3 text-base border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[48px]" placeholder="yourname@example.com" required>
            </div>
            <div class="mb-2">
                <label for="password" class="block text-gray-700 font-semibold mb-2 text-base">Password</label>
                <div class="relative">
                  <input
                    type="password"
                    id="login-password"
                    name="password"
                    placeholder="••••••••"
                    required
                    class="w-full px-4 py-3 pr-12 text-left text-base border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[48px]"
                    autocomplete="current-password"
                  />

                  <button
                    type="button"
                    id="toggle-password"
                    aria-label="Toggle password visibility"
                    class="absolute top-1/2 right-3 -translate-y-1/2 flex items-center justify-center w-9 h-9 rounded-md text-gray-500 hover:text-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  >
                    <i data-lucide="eye" class="h-5 w-5"></i>
                  </button>
                </div>
            </div>
            <p class="mb-4 text-right">
                <button type="button" id="forgot-password-link" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded">Forgot password?</button>
            </p>
            <p id="login-error" class="text-red-500 text-sm mb-4 hidden-view"></p>
            <p id="login-success" class="text-green-600 text-sm mb-4 hidden-view"></p>
            <button id="login-button" type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center justify-center min-h-[48px] text-base">
                <span id="login-button-text">Sign in</span>
                <span id="login-spinner" class="hidden ml-2 h-5 w-5 border-t-2 border-r-2 border-white rounded-full animate-spin"></span>
            </button>
        </form>
        <p class="mt-6 text-center text-gray-500 text-sm sm:text-base">
            Don't have an account?<br class="sm:hidden">
                <a href="signup-member-supabase.html" class="text-indigo-600 hover:text-indigo-800 font-semibold">Sign up as a Member</a> or
            <a href="signup-apprentice-supabase.html" class="text-indigo-600 hover:text-indigo-800 font-semibold">Sign up as an Apprentice</a>.
        </p>
    </div>

    <!-- Forgot password modal -->
    <div id="forgot-password-modal" class="fixed inset-0 z-50 hidden-view" aria-hidden="true">
        <div class="fixed inset-0 bg-black/50" id="forgot-password-backdrop"></div>
        <div class="fixed inset-0 flex items-center justify-center p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-sm p-6 relative">
                <h3 class="text-lg font-bold text-gray-900 mb-2">Reset password</h3>
                <p class="text-sm text-gray-600 mb-4">Enter your email and we'll send you a link to reset your password.</p>
                <form id="forgot-password-form">
                    <label for="forgot-email" class="block text-gray-700 font-medium mb-2 text-sm">Email</label>
                    <input type="email" id="forgot-email" name="email" class="w-full px-4 py-3 text-base border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 min-h-[44px]" placeholder="yourname@example.com" required>
                    <p id="forgot-password-error" class="text-red-500 text-sm mt-2 hidden-view"></p>
                    <p id="forgot-password-success" class="text-green-600 text-sm mt-2 hidden-view"></p>
                    <div class="mt-4 flex gap-2">
                        <button type="button" id="forgot-password-cancel" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Cancel</button>
                        <button type="submit" id="forgot-password-submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Send reset link</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        // Static import at the top level
        import { handleLogin, showError, requestPasswordReset } from './supabase-auth.js';
        
        console.log('🚀 Login page script starting...');
        
        // Verify imports are available
        if (typeof handleLogin !== 'function' || typeof showError !== 'function') {
            console.error('❌ Auth functions not available');
            throw new Error('Auth module not loaded');
        }

        function showForgotError(msg) {
            const el = document.getElementById('forgot-password-error');
            const successEl = document.getElementById('forgot-password-success');
            if (el) { el.textContent = msg || ''; el.classList.toggle('hidden-view', !msg); }
            if (successEl) { successEl.classList.add('hidden-view'); }
        }
        function showForgotSuccess(msg) {
            const el = document.getElementById('forgot-password-success');
            const errEl = document.getElementById('forgot-password-error');
            if (el) { el.textContent = msg || ''; el.classList.toggle('hidden-view', !msg); }
            if (errEl) { errEl.classList.add('hidden-view'); }
        }
        function openForgotModal() {
            const modal = document.getElementById('forgot-password-modal');
            const emailInput = document.getElementById('forgot-email');
            if (modal) { modal.classList.remove('hidden-view'); modal.classList.remove('hidden'); }
            if (emailInput) { emailInput.value = document.getElementById('login-email')?.value || ''; emailInput.focus(); }
            showForgotError(''); showForgotSuccess('');
        }
        function closeForgotModal() {
            const modal = document.getElementById('forgot-password-modal');
            if (modal) { modal.classList.add('hidden-view'); }
        }
        function setupForgotPassword() {
            const link = document.getElementById('forgot-password-link');
            const modal = document.getElementById('forgot-password-modal');
            const backdrop = document.getElementById('forgot-password-backdrop');
            const cancelBtn = document.getElementById('forgot-password-cancel');
            const form = document.getElementById('forgot-password-form');
            if (!link || !modal || !form) return;
            if (link.hasAttribute('data-forgot-attached')) return;
            link.setAttribute('data-forgot-attached', 'true');
            link.addEventListener('click', function () { openForgotModal(); });
            if (backdrop) backdrop.addEventListener('click', closeForgotModal);
            if (cancelBtn) cancelBtn.addEventListener('click', closeForgotModal);
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const emailEl = document.getElementById('forgot-email');
                const submitBtn = document.getElementById('forgot-password-submit');
                if (!emailEl) return;
                const email = emailEl.value.trim();
                if (!email) { showForgotError('Please enter your email.'); return; }
                showForgotError('');
                if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Sending...'; }
                try {
                    await requestPasswordReset(email);
                    showForgotSuccess('Check your email for a reset link.');
                    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Send reset link'; }
                    setTimeout(closeForgotModal, 2000);
                } catch (err) {
                    showForgotError(err?.message || 'Failed to send reset email.');
                    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'Send reset link'; }
                }
            });
        }

        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('login-password');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                toggleBtn.innerHTML = isPassword
                    ? '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18M10.584 10.587a2 2 0 002.829 2.829M9.88 4.24A10.94 10.94 0 0112 4c5 0 9.27 3.11 11 8a10.95 10.95 0 01-4.104 5.38M6.228 6.228C4.62 7.3 3.35 8.91 3 12c.877 2.404 2.22 4.3 4.066 5.67" /></svg>'
                    : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /><circle cx="12" cy="12" r="3" /></svg>';
            });
        }

        // Remove credentials from URL if present (security issue)
        if (window.location.search.includes('email=') || window.location.search.includes('password=')) {
            console.warn('⚠️ Credentials detected in URL - removing for security');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        // Show success message after password reset redirect
        if (window.location.search.includes('reset=success')) {
            const successEl = document.getElementById('login-success');
            if (successEl) {
                successEl.textContent = 'Password reset successful. You can now sign in.';
                successEl.classList.remove('hidden-view');
            }
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        
        console.log('✅ Auth module imported successfully');

        // Login handler function
        async function performLogin() {
            console.log('📝 Login initiated');
            
            const emailEl = document.getElementById('login-email');
            const passwordEl = document.getElementById('login-password');
            const loginBtn = document.getElementById('login-button');
            const btnText = document.getElementById('login-button-text');
            const spinEl = document.getElementById('login-spinner');
            
            if (!emailEl || !passwordEl) {
                console.error('❌ Form fields missing');
                showError('login-error', 'Form fields are missing. Please refresh the page.');
                return;
            }
            
            const email = emailEl.value.trim();
            const password = passwordEl.value;
            
            if (!email || !password) {
                showError('login-error', 'Please enter both email and password.');
                return;
            }
            
            // Update UI
            btnText.textContent = 'Signing in...';
            spinEl.classList.remove('hidden');
            loginBtn.disabled = true;
            
            try {
                console.log("🔐 Attempting login for:", email);
                await handleLogin(email, password);
                console.log("✅ Login successful, redirect should happen now");
            } catch (error) {
                console.error("❌ Login failed:", error);
                
                // Reset button state
                btnText.textContent = 'Sign in';
                spinEl.classList.add('hidden');
                loginBtn.disabled = false;
                
                // Show error if not already shown
                if (error?.message && !error.message.includes('EMAIL_NOT_VERIFIED')) {
                    showError('login-error', error.message || 'Login failed. Please try again.');
                }
            }
        }

        // Setup form handler when DOM is ready
        function setupLoginForm() {
            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');

            if (!loginForm || !loginButton) {
                console.error('❌ Form or button not found');
                return;
            }

            // Check if handler already attached
            if (loginForm.hasAttribute('data-handler-attached')) {
                return;
            }
            
            // Mark as attached
            loginForm.setAttribute('data-handler-attached', 'true');
            
            // Handle form submission (works for both button click and Enter key)
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                e.stopPropagation();
                console.log('📝 Form submit event triggered');
                
                // Validate form
                if (!loginForm.checkValidity()) {
                    loginForm.reportValidity();
                    return;
                }
                
                await performLogin();
            });
            
            console.log('✅ Login form handler attached');
        }

        function initLoginPage() {
            setupLoginForm();
            setupForgotPassword();
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initLoginPage);
        } else {
            initLoginPage();
        }
    </script>
    <script src="dark-mode.js"></script>
</body>
</html>
