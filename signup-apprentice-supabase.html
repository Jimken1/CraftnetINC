<!--
  Design summary:
  - Tailwind CLI build and tokenized form shell applied
  - Lucide icon + motion-safe polish added without backend changes
  - No auth or Supabase logic modified
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Become an Apprentice - Craftnet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dist/output.css">
    <link rel="stylesheet" href="dark-mode.css">
    <link rel="stylesheet" href="mobile-responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
        }
    </style>
</head>
<body class="auth-page auth-apprentice bg-cream text-ink">
    <div class="auth-shell max-w-xl w-full space-y-6 sm:space-y-8">
        <div>
            <a href="index.html" class="flex justify-center items-center">
                    <img src="logo.svg" alt="Craftnet logo" class="auth-logo-mark h-16 w-16 object-contain">
            </a>
            <h2 class="mt-4 sm:mt-6 text-center text-2xl sm:text-3xl font-extrabold text-gray-900">
                Become an Apprentice
            </h2>
            <p class="mt-2 text-center text-sm sm:text-base text-gray-600">
                Showcase your skills and get hired. 
            </p>
            <p class="mt-2 text-center text-sm sm:text-base text-gray-600">Already have an account? <a href="login-supabase.html" class="font-medium text-blue-600 hover:text-blue-500">Sign in</a></p>
        </div>
        <form id="signup-apprentice-form" class="mt-6 sm:mt-8 space-y-4 sm:space-y-6">
            <div class="rounded-md shadow-sm grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="apprentice-name" class="block text-base font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="apprentice-name" required placeholder="John Doe" class="block w-full px-4 py-3 text-base border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 min-h-[48px]">
                </div>
                <div>
                    <label for="apprentice-skill" class="block text-base font-medium text-gray-700 mb-2">Skill</label>
                    <input type="text" id="apprentice-skill" required placeholder="e.g., Web Development" class="block w-full px-4 py-3 text-base border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 min-h-[48px]">
                </div>
                <div>
                    <label for="apprentice-location" class="block text-base font-medium text-gray-700 mb-2">Location</label>
                    <input type="text" id="apprentice-location" required placeholder="City, Country" class="block w-full px-4 py-3 text-base border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 min-h-[48px]">
                </div>
                <div>
                    <label for="apprentice-email" class="block text-base font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="apprentice-email" required class="block w-full px-4 py-3 text-base border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 min-h-[48px]">
                </div>
                <div class="md:col-span-2 relative">
                    <label for="apprentice-password" class="block text-base font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="apprentice-password" required class="block w-full px-4 py-3 pr-12 text-base border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 min-h-[48px]">
                    <button
                        type="button"
                        class="password-toggle absolute right-3 top-[52%] flex items-center text-gray-500 hover:text-blue-600 focus:outline-none"
                        data-target="apprentice-password"
                        aria-label="Toggle password visibility"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0zm-9.5 0a9.5 9.5 0 0118 0 9.5 9.5 0 01-18 0z" />
                        </svg>
                    </button>
                </div>
                <div class="md:col-span-2">
                    <label for="referral-code" class="block text-base font-medium text-gray-700 mb-2">Referral Code (Optional)</label>
                    <input type="text" id="referral-code" placeholder="Enter referral code" class="block w-full px-4 py-3 text-base border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 min-h-[48px]">
                </div>
            </div>
            <p id="signup-apprentice-error" class="text-red-500 text-sm hidden"></p>
            <p id="signup-apprentice-success" class="text-green-600 text-sm hidden"></p>
            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 min-h-[48px]">Sign Up</button>
            </div>
        </form>
    </div>

    <script type="module">
        console.log('🚀 Apprentice signup module loading...');

        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📄 DOMContentLoaded fired for apprentice signup');

            document.querySelectorAll('.password-toggle').forEach((toggle) => {
                toggle.addEventListener('click', () => {
                    const input = document.getElementById(toggle.dataset.target);
                    if (!input) return;
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    toggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            });

            let handleApprenticeSignup, showError;
            try {
                const authModule = await import('./supabase-auth.js');
                handleApprenticeSignup = authModule.handleApprenticeSignup;
                showError = authModule.showError;
                console.log('✅ Apprentice signup imports successful');
            } catch (error) {
                console.error('❌ Failed to import supabase-auth.js:', error);
                // Fallback error handling
                showError = (elementId, message) => {
                    const errorEl = document.getElementById(elementId);
                    if (errorEl) {
                        errorEl.textContent = message;
                        errorEl.classList.remove('hidden-view', 'hidden');
                    }
                    alert(`Error: ${message}`);
                };
            }

            const signupApprenticeForm = document.getElementById('signup-apprentice-form');
            console.log('📝 Apprentice form element:', signupApprenticeForm);

            // Handle referral code from URL parameter
            function getReferralCodeFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('ref');
            }

            // Pre-fill referral code if present in URL
            const urlReferralCode = getReferralCodeFromUrl();
            if (urlReferralCode) {
                const referralCodeInput = document.getElementById('referral-code');
                referralCodeInput.value = urlReferralCode;
                referralCodeInput.readOnly = true;
                referralCodeInput.classList.add('bg-gray-100');

                // Show a message that referral code was applied
                const referralMessage = document.createElement('p');
                referralMessage.className = 'text-green-600 text-sm mt-2';
                referralMessage.textContent = `Referral code applied: ${urlReferralCode}`;
                referralCodeInput.parentNode.appendChild(referralMessage);
            }

            if (signupApprenticeForm && signupApprenticeForm.dataset.bound !== "1") {
                signupApprenticeForm.dataset.bound = "1";
                console.log('🎧 Attaching submit listener to apprentice form');
                signupApprenticeForm.addEventListener('submit', (e) => {
                    console.log('🔥 Apprentice form submit event fired!');
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('🛑 Prevented default form submission');

                    // Get form elements with null checks
                    const nameEl = document.getElementById('apprentice-name');
                    const skillEl = document.getElementById('apprentice-skill');
                    const locationEl = document.getElementById('apprentice-location');
                    const emailEl = document.getElementById('apprentice-email');
                    const passwordEl = document.getElementById('apprentice-password');
                    const referralCodeEl = document.getElementById('referral-code');

                    if (!nameEl || !skillEl || !locationEl || !emailEl || !passwordEl) {
                        showError("signup-apprentice-error", "Form fields are missing. Please refresh the page.");
                        return;
                    }

                    const name = nameEl.value.trim();
                    const skill = skillEl.value.trim();
                    const location = locationEl.value.trim();
                    const email = emailEl.value.trim();
                    const password = passwordEl.value;
                    const referralCode = referralCodeEl ? referralCodeEl.value.trim() : "";

                    // Validate required fields
                    if (!name || !skill || !location || !email || !password) {
                        showError("signup-apprentice-error", "Please fill in all required fields.");
                        return;
                    }

                    console.log('📤 Calling handleApprenticeSignup with:', { name, skill, location, email, passwordLength: password.length, referralCode });
                    handleApprenticeSignup(name, skill, location, email, password, referralCode || null);
                });
            } else {
                console.error('❌ Apprentice signup form not found!');
            }
        });
    </script>
    <script src="dark-mode.js"></script>
</body>
</html>
